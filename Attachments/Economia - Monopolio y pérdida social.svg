<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Monopolio, competencia y pérdida social</title>
  <desc id="desc">El monopolista produce donde el ingreso marginal iguala al costo marginal y cobra el precio de la demanda. La competencia produce donde la demanda iguala al costo marginal. El área entre ambas cantidades es la pérdida social.</desc>
  <rect width="1000" height="620" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .title { font-size: 24px; font-weight: 600; }
    .label { font-size: 18px; }
    .small { font-size: 16px; }
    .axis { stroke: #172033; stroke-width: 2; }
    .guide { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 7 7; }
    .demand { stroke: #2563eb; stroke-width: 5; fill: none; }
    .mr { stroke: #60a5fa; stroke-width: 5; fill: none; }
    .mc { stroke: #ea580c; stroke-width: 5; fill: none; }
    .dwl { fill: #f59e0b; opacity: 0.35; stroke: #d97706; stroke-width: 2; }
    .point { fill: #172033; }
  </style>

  <text class="title" x="500" y="42" text-anchor="middle">Monopolio frente a competencia</text>
  <g transform="translate(75,65)">
    <line class="axis" x1="70" y1="470" x2="820" y2="470"/>
    <line class="axis" x1="70" y1="470" x2="70" y2="45"/>

    <path class="demand" d="M120 85 L770 430"/>
    <path class="mr" d="M120 85 L500 455"/>
    <path class="mc" d="M125 390 L740 160"/>

    <circle class="point" cx="350" cy="307" r="6"/>
    <circle class="point" cx="459" cy="265" r="6"/>
    <circle class="point" cx="350" cy="208" r="6"/>

    <line class="guide" x1="350" y1="307" x2="350" y2="470"/>
    <line class="guide" x1="350" y1="208" x2="70" y2="208"/>
    <line class="guide" x1="459" y1="265" x2="459" y2="470"/>
    <line class="guide" x1="459" y1="265" x2="70" y2="265"/>

    <path class="dwl" d="M350 307 L459 265 L350 208 Z"/>

    <text class="label" x="778" y="435" fill="#2563eb">D</text>
    <text class="label" x="506" y="457" fill="#60a5fa">IM</text>
    <text class="label" x="747" y="164" fill="#ea580c">CMg</text>
    <text class="small" x="338" y="496" text-anchor="middle">Qm</text>
    <text class="small" x="459" y="496" text-anchor="middle">Qc</text>
    <text class="small" x="60" y="213" text-anchor="end">Pm</text>
    <text class="small" x="60" y="270" text-anchor="end">Pc</text>
    <text class="small" x="405" y="252" text-anchor="middle">pérdida social</text>
    <text class="small" x="315" y="188" text-anchor="end">Precio desde D</text>
    <text class="small" x="832" y="477">Q</text>
    <text class="small" x="61" y="38">P</text>
  </g>
</svg>
